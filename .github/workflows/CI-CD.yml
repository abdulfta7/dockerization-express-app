name: Node Express CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Docker image
        run: docker build -t express-hello-world:${{ github.sha }} .

      - name: Save Docker image to tar archive
        run: |
          mkdir -p image-artifact
          docker save express-hello-world:${{ github.sha }} -o image-artifact/express-hello-world.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-image
          path: image-artifact/express-hello-world.tar
          retention-days: 1

  push-to-docker-hub:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-image
          path: image-artifact

      - name: Load Docker image
        run: docker load -i image-artifact/express-hello-world.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push Docker image
        run: |
          docker tag express-hello-world:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/express-hello-world:latest
          docker tag express-hello-world:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/express-hello-world:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/express-hello-world:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/express-hello-world:${{ github.sha }} 
