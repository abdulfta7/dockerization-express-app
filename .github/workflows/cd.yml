name: Node Express CD

on:
  workflow_run:
    workflows: ["Node Express CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  push-to-docker-hub:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: image-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load Docker image
        run: docker load -i image-artifact/express-hello-world.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push Docker image
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker tag express-hello-world:${IMAGE_SHA} ${{ secrets.DOCKER_USERNAME }}/express-hello-world:latest
          docker tag express-hello-world:${IMAGE_SHA} ${{ secrets.DOCKER_USERNAME }}/express-hello-world:${IMAGE_SHA}
          docker push ${{ secrets.DOCKER_USERNAME }}/express-hello-world:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/express-hello-world:${IMAGE_SHA}
